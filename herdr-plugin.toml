id = "pimpmuckl.codex-workflows"
name = "Codex Workflows"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Start feature work, issue fixes, and pull-request reviews in isolated Codex workspaces."
platforms = ["windows"]

[[actions]]
id = "issue-to-pr"
title = "Issue or pull request"
contexts = ["workspace", "tab", "pane"]
command = ["node", "controller.js", "start"]

[[actions]]
id = "feature-to-pr"
title = "Feature or fix"
contexts = ["workspace", "tab", "pane"]
command = ["node", "controller.js", "start", "task"]

[[actions]]
id = "cleanup-current-workflow"
title = "Clean up current Codex workflow"
contexts = ["workspace", "tab", "pane"]
command = ["node", "controller.js", "cleanup"]

[[panes]]
id = "input"
title = "Codex Workflow"
placement = "popup"
width = "70%"
height = 12
command = ["node", "controller.js", "popup"]

[[panes]]
id = "progress"
title = "Starting Codex"
placement = "split"
command = ["node", "controller.js", "progress"]
